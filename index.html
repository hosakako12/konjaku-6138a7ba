<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>今昔比較マップ</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
<style>
  :root { --bg:#fff; --panel:rgba(255,255,255,.96); --fg:#1d2733; --muted:#5f6b78; --line:#d6dbe1;
    --accent:#2f6fb0; --accent-fg:#fff; --hover:#eef4fb; --warn:#a05a00; --maparea:#e8eaed; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#161b22; --panel:rgba(22,27,34,.95); --fg:#e3e8ee; --muted:#9aa6b2; --line:#36404c;
      --accent:#5b9bd8; --accent-fg:#0d1117; --hover:#22303f; --warn:#e0a050; --maparea:#2a2f36; color-scheme:dark; }
  }
  * { box-sizing:border-box; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--fg);
    font-family:-apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", sans-serif; }
  body { display:flex; flex-direction:column; }
  header { display:flex; flex-wrap:wrap; align-items:center; gap:6px 10px; font-size:13px;
    padding:6px max(10px, env(safe-area-inset-right)) 6px max(10px, env(safe-area-inset-left));
    padding-top:max(6px, env(safe-area-inset-top));
    border-bottom:1px solid var(--line); position:relative; z-index:1100; background:var(--bg); }
  header h1 { font-size:15px; margin:0 4px 0 0; }
  select, input[type=search], button { font:inherit; padding:5px 8px; border:1px solid var(--line);
    border-radius:6px; background:var(--bg); color:var(--fg); }
  select { max-width:260px; }
  button { cursor:pointer; white-space:nowrap; }
  button:hover, select:hover { border-color:var(--accent); }
  :focus-visible { outline:2px solid var(--accent); outline-offset:1px; }
  .grp { display:flex; align-items:center; gap:4px; }
  .seg { gap:0; }
  .seg button { border-radius:0; margin-left:-1px; }
  .seg button:first-child { border-radius:6px 0 0 6px; margin-left:0; }
  .seg button:last-child { border-radius:0 6px 6px 0; }
  .seg button.on { background:var(--accent); color:var(--accent-fg); border-color:var(--accent); position:relative; }
  .step { padding:5px 7px; }
  #q { width:200px; }
  #results { position:absolute; top:100%; left:10px; width:min(360px, calc(100vw - 20px)); max-height:50vh;
    overflow:auto; background:var(--bg); border:1px solid var(--line); border-radius:8px;
    box-shadow:0 2px 10px rgba(0,0,0,.2); }
  #results div { padding:8px 12px; cursor:pointer; }
  #results div:hover { background:var(--hover); }
  #hint { color:var(--warn); }
  a { color:var(--accent); }
  #maps { flex:1; display:flex; position:relative; min-height:0; }
  .map { flex:1; position:relative; background:var(--maparea); }
  #mapL { border-right:2px solid var(--bg); }
  body:not(.split) #mapL { display:none; }
  .label { position:absolute; top:8px; left:50%; transform:translateX(-50%); z-index:800; max-width:80%;
    background:rgba(29,39,51,.82); color:#fff; font-size:12px; padding:3px 10px; border-radius:12px;
    pointer-events:none; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .label.none { background:rgba(160,90,0,.9); }
  .cross { position:absolute; left:50%; top:50%; width:22px; height:22px; margin:-11px 0 0 -11px;
    z-index:700; pointer-events:none; }
  .cross:before, .cross:after { content:""; position:absolute; background:rgba(220,0,0,.85); }
  .cross:before { left:10px; top:0; width:2px; height:22px; }
  .cross:after { top:10px; left:0; height:2px; width:22px; }
  body.nocross .cross { display:none; }
  #ratioGrp, #timeBox { display:none; }
  body.swipe #ratioGrp, body.fade #ratioGrp { display:flex; }
  body.time #timeBox { display:block; }
  body.time .oldOnly, body.time .newOnly { display:none; }
  #swipeLine { position:absolute; top:0; bottom:0; width:3px; margin-left:-1.5px; background:#fff;
    box-shadow:0 0 4px rgba(0,0,0,.6); z-index:750; display:none; pointer-events:none; }
  body.swipe #swipeLine { display:block; }
  #handle { position:absolute; top:50%; left:50%; width:34px; height:34px; margin:-17px 0 0 -17px;
    border-radius:50%; background:#fff; box-shadow:0 1px 5px rgba(0,0,0,.5); pointer-events:auto;
    cursor:ew-resize; touch-action:none; display:flex; align-items:center; justify-content:center;
    color:#333; font-size:13px; user-select:none; }
  #timeBox { position:absolute; z-index:900; left:50%; transform:translateX(-50%);
    bottom:calc(28px + env(safe-area-inset-bottom)); width:min(720px, calc(100% - 20px));
    background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:8px 14px 6px;
    box-shadow:0 2px 10px rgba(0,0,0,.2); }
  #eraHead { display:flex; align-items:center; gap:6px 10px; flex-wrap:wrap; }
  #eraHead b { font-size:20px; }
  #eraHead span { font-size:12px; color:var(--muted); flex:1 1 9em; min-width:9em; }
  #kinds button { font-size:12px; padding:3px 8px; }
  #era { width:100%; accent-color:var(--accent); margin:4px 0 0; }
  #ticks { display:flex; font-size:11px; color:var(--muted); }
  #ticks span { flex:1; text-align:center; cursor:pointer; padding:2px 0; white-space:nowrap; }
  #ticks span:first-child { text-align:left; } #ticks span:last-child { text-align:right; }
  #ticks span.on { color:var(--accent); font-weight:700; }
  #ticks span.none { text-decoration:line-through; opacity:.6; }
  .leaflet-control-attribution { font-size:11px; }
  #here { position:absolute; z-index:950; top:40px; right:10px; width:min(330px, calc(100% - 20px));
    max-height:calc(100% - 160px); overflow:auto; background:var(--panel); border:1px solid var(--line);
    border-radius:10px; padding:8px 12px 10px; box-shadow:0 2px 10px rgba(0,0,0,.2); font-size:12px; }
  #here[hidden] { display:none; }
  #here h2 { font-size:13px; margin:0; display:flex; align-items:center; gap:6px; }
  #here h2 button { margin-left:auto; padding:0 7px; font-size:14px; }
  #here h3 { font-size:12px; margin:8px 0 3px; color:var(--muted); }
  #here .row { margin:3px 0; line-height:1.5; }
  #here .src { color:var(--muted); }
  #here .chip { display:inline-block; padding:1px 7px; margin:2px 3px 0 0; border:1px solid var(--line);
    border-radius:10px; cursor:pointer; white-space:nowrap; }
  #here .chip:hover { border-color:var(--accent); }
  #here .chip.on { background:var(--accent); color:var(--accent-fg); border-color:var(--accent); }
  #here .chip.no { text-decoration:line-through; opacity:.5; cursor:default; }
  #here .miss { color:var(--muted); margin-top:3px; }
  #hereBtn.on { background:var(--accent); color:var(--accent-fg); border-color:var(--accent); }
  @media (max-width:720px) {
    header h1, .wide { display:none; }
    select { max-width:46vw; }
    #q { width:auto; flex:1; min-width:0; }
    .grp.search { flex:1 1 100%; min-width:0; }
    .grp.search button { padding:5px 6px; }
    #maps { flex-direction:column; }
    #mapL { border-right:0; border-bottom:2px solid var(--bg); }
    #ticks { font-size:10px; }
  }
</style>
</head>
<body class="split">
<header>
  <h1>今昔比較マップ</h1>
  <div class="grp oldOnly">昔
    <button class="step" id="prevOld" title="ひとつ前の年代">◀</button>
    <select id="oldSel"></select>
    <button class="step" id="nextOld" title="ひとつ後の年代">▶</button>
  </div>
  <div class="grp newOnly">今 <select id="newSel"></select></div>
  <div class="grp seg" id="modes">
    <button data-mode="split" class="on" title="左右に並べる（1）">左右</button>
    <button data-mode="swipe" title="境目を動かして比べる（2）">スワイプ</button>
    <button data-mode="fade" title="昔の地図を透かす（3）">透過</button>
    <button data-mode="time" title="年代を順に切り替える（4）">年代</button>
  </div>
  <div class="grp" id="ratioGrp"><input id="ratio" type="range" min="0" max="100" value="50" aria-label="比較の割合"></div>
  <div class="grp search">
    <input id="q" type="search" placeholder="地名・住所・緯度経度で検索" enterkeyhint="search">
    <button id="go">検索</button>
    <button id="loc">現在地</button>
    <button id="hereBtn" title="今見ている付近で見られる地図・写真の一覧">この付近</button>
    <button id="copy">URLコピー</button>
  </div>
  <div class="grp wide">
    <label><input type="checkbox" id="crossChk" checked> 十字線</label>
    <a id="gsiLink" href="https://maps.gsi.go.jp/" target="_blank" rel="noopener">地理院地図で開く</a>
  </div>
  <span id="hint"></span>
  <div id="results" hidden></div>
</header>
<div id="maps">
  <div id="mapL" class="map"><div class="label" id="labelL"></div><div class="cross"></div></div>
  <div id="mapR" class="map">
    <div class="label" id="labelR"></div><div class="cross"></div>
    <div id="here" hidden></div>
    <div id="swipeLine"><div id="handle" title="ドラッグで境目を動かす">⇔</div></div>
    <div id="timeBox">
      <div id="eraHead">
        <div class="grp seg" id="kinds">
          <button data-kind="photo">空中写真</button>
          <button data-kind="map">地形図</button>
        </div>
        <b id="eraName"></b><span id="eraNote"></span>
      </div>
      <input id="era" type="range" min="0" max="4" step="1" value="0" aria-label="年代">
      <div id="ticks"></div>
    </div>
  </div>
</div>

    // 今昔マップの地域は最初の時期のタイル（ズーム10）があるかで判定し、見つかった地域だけ全時期を
    // 表示中のズームで調べる（時期によって収録範囲が狭いことがある）
    const hit = await Promise.all(KJ.map(set => probeDef(kjDef(set, set.e[0]), c, 10)));
    kjHere = KJ.filter((set, i) => hit[i]).sort((a, b) => b.e.length - a.e.length);
    await Promise.all([
      // 写真は撮影範囲の端が粗いズームでは判定できないので、表示中のズームで調べる
      ...PHOTOS.map(d => probeDef(d, c, Math.max(d.layers[0].min, Math.min(Math.round(mapR.getZoom()), d.layers[0].max)))),
      probeDef(SWALE, c),
      ...kjHere.flatMap(set => set.e.map(e => {
        const d = kjDef(set, e);
        return probeDef(d, c, Math.max(10, Math.min(Math.round(mapR.getZoom()), d.layers[0].max)));
      })),
    ]);
    MW_DEFS.forEach(d => avail[d.key] = !!sheetAt(d, c));
    let changed = false;
    if (!st.kjSet || !kjHere.includes(st.kjSet)) {
      const next = kjHere[0] || null;
      if (next !== st.kjSet) {
        st.kjSet = next;
        if (st.mode === 'time' && st.kind === 'map') { st.era = 0; st.eraKey = null; changed = true; }
      }
    }
    // 写真の段階はこの付近にある年代で並び直す。表示中の年代が無ければ近い年代に替える
    if (st.mode === 'time') { const prev = st.eraKey; resolveEra(); changed ||= st.eraKey !== prev; }
    buildOldOptions();
    if (changed) applyLayers();
    else if (st.mode === 'time') renderTime();
    renderHere();
    updateLabels();
  }, 400);
}
mapR.on('moveend', () => { updateHint(); saveState(); probeAll(); });

// 昔側の選択肢。地形図はこの付近にある地域だけ並べる
function buildOldOptions() {
  const sel = $('oldSel');
  sel.innerHTML = '';
  const add = (parent, d) => parent.appendChild(
    new Option(d.name + (avail[d.key] === false ? '（この付近なし）' : ''), d.key, false, d === st.old));
  const gm = document.createElement('optgroup');
  gm.label = '旧版地形図（全国）日本版MapWarper';
  MW_DEFS.forEach(d => add(gm, d));
  sel.appendChild(gm);
  const sets = [...kjHere];
  if (st.old.kj && !sets.includes(st.old.set)) sets.push(st.old.set);
  sets.forEach(set => {
    const g = document.createElement('optgroup');
    g.label = `旧版地形図（${set.n}）今昔マップ`;
    set.e.forEach(e => add(g, kjDef(set, e)));
    sel.appendChild(g);
  });
  const gp = document.createElement('optgroup');
  gp.label = '空中写真（国土地理院）';
  PHOTOS.forEach(d => add(gp, d));
  sel.appendChild(gp);
  const go = document.createElement('optgroup');
  go.label = 'その他';
  add(go, SWALE);
  sel.appendChild(go);
}
buildOldOptions();
NEW.forEach(d => $('newSel').add(new Option(d.name, d.key, false, d === st.now)));
$('oldSel').addEventListener('change', e => { st.old = findOld(e.target.value); applyLayers(); });
$('newSel').addEventListener('change', e => { st.now = NEW.find(d => d.key === e.target.value); applyLayers(); });

// 昔側を前後に送る。年代モードでは段階を送る
function stepOld(dir) {
  if (st.mode === 'time') { setEra(st.era + dir); return; }
  const opts = [...$('oldSel').options];
  const i = opts.findIndex(o => o.value === st.old.key) + dir;
  if (i < 0 || i >= opts.length) return;
  st.old = findOld(opts[i].value);
  $('oldSel').value = st.old.key;
  applyLayers();
}
function setEra(i) {
  i = Math.max(0, Math.min(timeSteps().length - 1, i));
  if (i === st.era) return;
  st.era = i;
  st.eraKey = timeSteps()[i].key;
  applyLayers();
}
$('prevOld').onclick = () => stepOld(-1);
$('nextOld').onclick = () => stepOld(1);
$('era').addEventListener('input', e => setEra(+e.target.value));
document.querySelectorAll('#kinds button').forEach(b => b.onclick = () => {
  if (st.kind === b.dataset.kind) return;
  st.kind = b.dataset.kind;
  st.era = 0;
  st.eraKey = null;
  applyLayers();
});
L.DomEvent.disableClickPropagation($('timeBox'));
L.DomEvent.disableScrollPropagation($('timeBox'));
document.querySelectorAll('#modes button').forEach(b => b.onclick = () => setMode(b.dataset.mode));
$('crossChk').addEventListener('change', e => document.body.classList.toggle('nocross', !e.target.checked));

// キー操作: , . で昔側を前後、1〜4でモード切替
document.addEventListener('keydown', ev => {
  if (ev.target.tagName === 'INPUT' && ev.target.type !== 'range' && ev.target.type !== 'checkbox') return;
  if (ev.target.tagName === 'SELECT') return;
  if (ev.key === ',' || ev.key === '<') stepOld(-1);
  else if (ev.key === '.' || ev.key === '>') stepOld(1);
  else if (MODES[+ev.key - 1]) setMode(MODES[+ev.key - 1]);
});

// 国土地理院の住所検索API。「35.68, 139.76」のような緯度経度はそのまま移動
const q = $('q'), results = $('results');
function showResults(html) { results.innerHTML = html; results.hidden = false; }
async function search() {
  const text = q.value.trim();
  if (!text) return;
  const ll = text.match(/^\s*(-?\d+(?:\.\d+)?)\s*[,，\s]\s*(-?\d+(?:\.\d+)?)\s*$/);
  if (ll) { mapR.setView([+ll[1], +ll[2]], Math.max(mapR.getZoom(), 16)); results.hidden = true; return; }
  showResults('<div>検索中…</div>');
  try {
    const r = await fetch('https://msearch.gsi.go.jp/address-search/AddressSearch?q=' + encodeURIComponent(text));
    const list = await r.json();
    if (!list.length) { showResults('<div>見つかりませんでした。表記を変えて試してください</div>'); return; }
    results.innerHTML = '';
    list.slice(0, 40).forEach(f => {
      const d = document.createElement('div');
      d.textContent = f.properties.title;
      d.onclick = () => {
        const [lng, lat] = f.geometry.coordinates;
        mapR.setView([lat, lng], Math.max(mapR.getZoom(), 16));
        results.hidden = true;
      };
      results.appendChild(d);
    });
    if (list.length === 1) results.firstChild.click();
  } catch (err) {
    showResults('<div>検索できませんでした。通信状態を確認してください</div>');
  }
}
$('go').onclick = search;
q.addEventListener('keydown', ev => { if (ev.key === 'Enter') { ev.preventDefault(); search(); } });
[mapL, mapR].forEach(m => m.on('click movestart', () => { results.hidden = true; }));

let here;
$('loc').onclick = () => {
  if (!navigator.geolocation) { $('hint').textContent = 'このブラウザでは現在地を取得できません'; return; }
  $('hint').textContent = '現在地を取得中…';
  navigator.geolocation.getCurrentPosition(p => {
    const ll = [p.coords.latitude, p.coords.longitude];
    here && here.remove();
    here = L.circleMarker(ll, { radius:7, color:'#fff', weight:2, fillColor:'#1a73e8', fillOpacity:1 }).addTo(mapR);
    mapR.setView(ll, Math.max(mapR.getZoom(), 16));
    $('hint').textContent = '';
  }, () => { $('hint').textContent = '現在地を取得できませんでした（位置情報の許可を確認してください）'; },
  { enableHighAccuracy:true, timeout:10000 });
};
$('copy').onclick = async ev => {
  saveState();
  const btn = ev.currentTarget;
  try { await navigator.clipboard.writeText(location.href); btn.textContent = 'コピーしました'; }
  catch { btn.textContent = 'コピー不可'; }
  setTimeout(() => btn.textContent = 'URLコピー', 1500);
};

// 「この付近」パネル。画面の中心で見られる地形図・空中写真を一覧にし、押すとその図に切り替える
const hereBox = $('here');
function hereOpen(open) {
  hereBox.hidden = !open;
  $('hereBtn').classList.toggle('on', open);
  try { localStorage.setItem('konjaku-here', open ? '1' : '0'); } catch {}
  if (open) renderHere();
}
$('hereBtn').onclick = () => hereOpen(hereBox.hidden);
L.DomEvent.disableClickPropagation(hereBox);
L.DomEvent.disableScrollPropagation(hereBox);

function pickOld(d) {
  if (st.mode === 'time') {
    const kind = d.photo ? 'photo' : 'map', save = st.kind;
    st.kind = kind;
    if (timeSteps(true).includes(d)) { st.eraKey = d.key; applyLayers(); return; }
    st.kind = save;
    setMode('swipe');
  }
  st.old = d;
  $('oldSel').value = d.key;
  applyLayers();
}
function renderHere() {
  if (hereBox.hidden) return;
  const cur = curOld(), el = (tag, cls, text) => {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;
    return e;
  };
  const chip = (d, text) => {
    const zoom = avail[d.key] !== false && mapR.getZoom() < d.minZ && !d.low;
    const c = el('span', 'chip' + (d === cur ? ' on' : '') + (avail[d.key] === false ? ' no' : ''),
      text + (zoom ? '（拡大すると見られます）' : ''));
    c.title = d.name;
    // 拡大しないと出ない図は、押したら見られるところまで拡大する
    if (avail[d.key] !== false) c.onclick = () => { pickOld(d); if (zoom) mapR.setZoom(d.minZ); };
    return c;
  };
  const row = (label, src, chips) => {
    const r = el('div', 'row');
    r.append(el('b', '', label), ' ', el('span', 'src', src), el('br'));
    chips.forEach(c => r.append(c));
    return r;
  };
  hereBox.innerHTML = '';
  const close = el('button', '', '×');
  close.title = '閉じる';
  close.onclick = () => hereOpen(false);
  const h = el('h2', '', 'この付近で見られるもの');
  h.append(close);
  hereBox.append(h);

  hereBox.append(el('h3', '', '地形図'));
  kjHere.forEach(set => hereBox.append(row(`${set.n}周辺`, '今昔マップ',
    set.e.map(e => chip(kjDef(set, e), e[0] + (e[1] === '2man' ? '（2万）' : ''))))));
  MW_DEFS.forEach(d => {
    const r = sheetAt(d, mapR.getCenter());
    if (!r) return;
    const label = { mw50k:'5万分1', mw200c:'20万分1地勢図', mw200t:'20万分1帝国図' }[d.key];
    const when = d === MW_DEF ? sheetYear(r) : d === TEIKOKU_DEF ? '1906〜44年のいずれか' : '戦前';
    hereBox.append(row(label, `図幅「${r[5]}」` + (lowNow(d) ? '（拡大すると見られます。今は20万分1で代用）' : ''),
      [chip(d, when)]));
  });
  if (!kjHere.length) hereBox.append(el('div', 'miss', '今昔マップ（年代別の地形図）はこの付近に無し'));

  hereBox.append(el('h3', '', '空中写真（国土地理院）'));
  const have = PHOTOS.filter(d => avail[d.key]);
  const r = el('div', 'row');
  have.forEach(d => r.append(chip(d, d.key === 'airphoto' ? '2004〜（簡易）' : NENDO.includes(+d.short) ? d.short : d.name)));
  r.append(chip(LATEST_PHOTO, '最新'));
  hereBox.append(r);
  const missing = PHOTOS.filter(d => avail[d.key] === false && !d.key.startsWith('n') &&
    !['o1928', 'riku10'].includes(d.key)).map(d => d.name);
  if (missing.length) hereBox.append(el('div', 'miss', 'この付近に無し：' + missing.join('、')));
  if (PHOTOS.some(d => avail[d.key] === undefined)) hereBox.append(el('div', 'miss', '確認中…'));
  hereBox.append(el('div', 'miss', `写真の有無は画面の中心をズーム${Math.round(mapR.getZoom())}で調べた結果です`));

  if (avail[SWALE.key]) {
    hereBox.append(el('h3', '', 'その他'));
    hereBox.append(el('div', 'row')).append(chip(SWALE, '明治期の低湿地'));
  }
}

setMode(st.mode);
probeAll();
hereOpen((() => { try { return localStorage.getItem('konjaku-here'); } catch { return null; } })() !== '0' && innerWidth > 720);
</script>
</body>
</html>
